<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pencatatan Buwuhan</title>
  <meta name="description" content="Catat buwuhan tamu hajatan dengan rapi: input, data, laporan, dan cetak.">
  <meta name="theme-color" content="#ffae25">
  <link rel="icon" type="image/png" href="wallet.png">
  <link rel="apple-touch-icon" href="wallet.png">
  <style>
    :root { --ink: #1c2a10; --orange: #ff6b3a; --bg: #f2f8e8; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    .bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      padding: 0 14px;
      padding-top: env(safe-area-inset-top, 0);
      background: #ffae25;
      box-sizing: content-box;
    }
    .bar img { width: 26px; height: 26px; display: block; }
    .bar strong { flex: 1; font-size: 15px; letter-spacing: -.01em; }
    .bar a {
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .55);
    }
    .bar a:hover { background: rgba(255, 255, 255, .85); }
    .bar a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

    .stage { position: relative; flex: 1; min-height: 0; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }

    .loading {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--bg);
      transition: opacity .3s;
    }
    .loading.done { opacity: 0; pointer-events: none; }
    .loading img { width: 84px; height: 84px; animation: bob 1.4s ease-in-out infinite; }
    .loading p { margin: 0; font-weight: 600; }
    .loading small { color: #55664a; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .loading img { animation: none; } }
  </style>
</head>
<body>

  <header class="bar">
    <img src="wallet.png" alt="" width="26" height="26">
    <strong>Pencatatan Buwuhan</strong>
    <a id="open-tab" href="#" target="_blank" rel="noopener">Buka di tab baru</a>
  </header>

  <div class="stage">
    <div class="loading" id="loading">
      <img src="wallet.png" alt="" width="84" height="84">
      <p>Memuat aplikasi...</p>
      <small>Jika tidak muncul, gunakan tombol "Buka di tab baru".</small>
    </div>
    <iframe id="app" title="Aplikasi Pencatatan Buwuhan"
            allow="clipboard-write; fullscreen"></iframe>
  </div>

  <script>
    // Ganti URL ini jika Web App Apps Script di-deploy ulang dengan URL baru
    var APP_URL = 'https://script.google.com/macros/s/AKfycby24HMH_Ah7fJ6ICB4BXgjcncR_y5RZ7lCfhlSNhQIXg5H7UHMmy03AsTVTK7YyKNwwkQ/exec';

    var frame = document.getElementById('app');
    var loading = document.getElementById('loading');
    document.getElementById('open-tab').href = APP_URL;

    frame.addEventListener('load', function () { loading.classList.add('done'); });
    frame.src = APP_URL;
  </script>
</body>
</html>
